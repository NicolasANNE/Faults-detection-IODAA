defaults:
  - fault_dataset
  - model: unet_base
  - _self_

data:
  features_path: data/raw/gems-geodawn-numerical-features.tif
  labels_path: data/raw/existing_faults.tif

training:
  epochs: 30
  batch_size: 16
  num_workers: 0
  device: auto
  deterministic: false
  checkpoint_dir: checkpoints
  save_every: 0
  optimizer:
    _target_: torch.optim.AdamW
    lr: 0.001
    weight_decay: 0.0001
  criterion:
    _target_: src.metrics.MaskedBCEWithDTILoss
    bce_weight: 0.7
    dti_weight: 0.3
    alpha: 0.2
    beta: 0.8

inference:
  enabled: false
  output_path: predictions/fault_probability.tif
  heatmap_enabled: true
  heatmap_path: artifacts/fault_probability_heatmap.png
  gaussian_sigma_scale: 0.125

hydra:
  job:
    chdir: false
